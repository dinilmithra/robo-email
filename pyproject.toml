[project]
name = "robo-email"
version = "0.1.2"
description = "Reusable HTML email report rendering and local delivery utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
]

[tool.poetry]
packages = [{ include = "robo_email" }]
exclude = ["tools/**"]

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
