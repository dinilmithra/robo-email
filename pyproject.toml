[project]
name = "robo-email"
version = "0.1.10"
description = "Reusable HTML email report rendering and local delivery utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
]

[tool.poetry]
packages = [{ include = "robo_email" }]
exclude = ["tools/**"]

[tool.poetry.group.dev.dependencies]
black = "26.5.1"

[tool.black]
line-length = 88
target-version = ["py312"]

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
